<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pile Plan Optimizer — Castillo Engineering</title>
    <!-- Jost is SELF-HOSTED. Loaded from the Google CDN every face reported
         status "error" and text silently fell back, so the brand typeface was
         not actually applying. One variable file covers Regular/Semibold/Bold
         (Castillo Branding Style Guide V2) in a single 26 KB request and works
         on a restricted network. -->
    <link rel="preload" href="./fonts/jost-variable.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Jost";
        src: url("./fonts/jost-variable.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        background: #ffffff;
        color: #333132;
        font-family: "Jost", system-ui, sans-serif;
        /* Jost's default figures are proportional; pile schedules need columns
           of numbers to line up. */
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1;
      }
      input, select, button, table, textarea { font-family: inherit; }
      * {
        box-sizing: border-box;
      }
      input[type="range"] {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
