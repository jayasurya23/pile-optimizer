# pile-optimizer — static SPA + EasyAuth tripwire.
#
# AUTHORIZATION IS NOT DONE HERE. The gate is jwtClaimChecks.allowedGroups in the
# Container Apps auth sidecar (see structcalc/docs/ACCESS_CONTROL.md). This file
# contains a TRIPWIRE: it fails closed if the sidecar is ever removed from the
# request path — auth disabled, unauthenticatedClientAction set to AllowAnonymous,
# or someone reaching the container port directly.
#
# It deliberately matches on the PRESENCE of an injected header, never on its
# value. Two reasons:
#   1. Microsoft's guarantee that clients cannot set X-MS-CLIENT-PRINCIPAL-* is a
#      single undocumented sentence. Because nothing here authorizes on header
#      content, a forged header buys an attacker nothing.
#   2. What X-MS-CLIENT-PRINCIPAL-NAME actually contains is not guaranteed to be
#      a UPN — if it is a display name, value-matching would 403 all 106 staff.
#      See the commented stage-2 block at the bottom.

map $http_x_ms_client_principal_id $deny_no_easyauth {
    default 0;
    ""      1;   # no sidecar in the request path -> fail closed
}

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Container Apps probes hit the container port directly and carry no EasyAuth
    # headers. This MUST bypass the tripwire or the revision never goes Healthy
    # and the deploy looks like a broken image.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location = /denied.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # index.html must never be cached: it names the content-hashed bundles, so a
    # stale copy points at assets that no longer exist after a deploy.
    location = /index.html {
        include /etc/nginx/snippets/require-easyauth.conf;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Vite emits content-hashed filenames, so these are safe to pin forever.
    location /assets/ {
        include /etc/nginx/snippets/require-easyauth.conf;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /sample-pile-data.xlsx {
        include /etc/nginx/snippets/require-easyauth.conf;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/require-easyauth.conf;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    error_page 403 /denied.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/wasm;
}

# ── Stage 2, intentionally disabled ────────────────────────────────────────────
# Enable ONLY after observing the literal value of X-MS-CLIENT-PRINCIPAL-NAME for
# one member and one guest on the deployed app (docs/AUTH.md records both). This
# is still only a tripwire — the group check remains the gate.
