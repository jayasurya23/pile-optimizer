# The app is entirely self-contained: no API calls, no telemetry, no remote
# assets. Jost is self-hosted, so nothing from fonts.googleapis.com or
# fonts.gstatic.com is needed and the policy no longer allows either.
# 'unsafe-inline' for styles is required — the UI is built with React inline
# style objects throughout.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
